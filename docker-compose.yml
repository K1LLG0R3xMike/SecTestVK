services:
  db:
    image: postgres:15-alpine
    container_name: sectest_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sectest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sectest123}
      POSTGRES_DB: ${POSTGRES_DB:-sectest_vk}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sectest -d sectest_vk"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sectest_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sectest_backend
    volumes:
      - ./backend:/app
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./workers
      dockerfile: Dockerfile
    container_name: sectest_worker
    volumes:
      - ./workers:/app
      - /var/run/docker.sock:/var/run/docker.sock  # Para que el worker lance otros contenedores
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A tasks.celery_app worker --loglevel=info

  zap:
    image: ${ZAP_DOCKER_IMAGE:-ghcr.io/zaproxy/zaproxy:stable}
    container_name: sectest_zap
    profiles:
      - tools
    command: ["sleep", "infinity"]

  ai_analyzer:
    build:
      context: ./ai_analyzer
      dockerfile: Dockerfile
    container_name: sectest_ai_analyzer
    volumes:
      - ./ai_analyzer:/app
    env_file:
      - .env
    ports:
      - "8001:8001"
    depends_on:
      - redis
    environment:
      - CLAUDE_API_KEY=${CLAUDE_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload

  openclaw:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: sectest_openclaw
    user: "0:0"
    environment:
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN}
      - OPENCLAW_DISABLE_BONJOUR=1
      - OLLAMA_HOST=https://ollama.com
      - OLLAMA_API_KEY=${OLLAMA_API_KEY}
    ports:
      - "18789:18789"
    volumes:
      - openclaw_data:/root/.openclaw
    command: >
      sh -lc "if [ ! -f /root/.openclaw/agents/main/agent/auth-profiles.json ]; then node dist/index.js onboard --non-interactive --accept-risk --mode local --no-install-daemon --skip-channels --skip-search --skip-skills --skip-ui --skip-health --gateway-auth token --gateway-bind lan --gateway-port 18789 --gateway-token \"$$OPENCLAW_GATEWAY_TOKEN\" --auth-choice ollama; fi && node dist/index.js config set --batch-json '[{\"path\":\"gateway.mode\",\"value\":\"local\"},{\"path\":\"gateway.bind\",\"value\":\"lan\"},{\"path\":\"gateway.http.endpoints.chatCompletions.enabled\",\"value\":true},{\"path\":\"gateway.auth.mode\",\"value\":\"token\"}]' && node dist/index.js config set gateway.auth.token \"$$OPENCLAW_GATEWAY_TOKEN\" && exec node dist/index.js gateway run --allow-unconfigured --auth token --bind lan --port 18789 --token \"$$OPENCLAW_GATEWAY_TOKEN\""

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sectest_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=/api
    depends_on:
      - backend

volumes:
  postgres_data:
  openclaw_data:
